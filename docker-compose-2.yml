services:
  casdoor:
    build:
      context: .
      dockerfile: Dockerfile
      target: STANDARD
    image: skynit/casdoor:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - RUNNING_IN_DOCKER=true
      - driverName=mysql
      - dataSourceName=root:123456@tcp(mysql:3306)/
      - dbName=casdoor
      - GIN_MODE=release
    volumes:
      - ./conf:/conf # 挂载配置文件目录
      - ./logs:/logs # 挂载日志目录
      - ./files:/files # 挂载文件存储目录
      - casdoor_data:/data
    depends_on:
      - mysql
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=casdoor
      - MYSQL_USER=casdoor
      - MYSQL_PASSWORD=123456
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  casdoor_data:
  mysql_data:
